## ─────────────────────────────────────────────────────────────
## Pulse IoT — EMQX 5 configuration
##
## Device credentials live in Postgres and are exposed through the emqx_authn /
## emqx_acl views (migration 0004). Disabling a device in the panel therefore
## revokes its broker access on the next connect, with no broker restart.
##
## NOTE ON SUBSTITUTION: HOCON does not expand ${...} inside quoted strings, which
## is exactly why the `${username}` placeholders below reach EMQX intact. The flip
## side is that this file cannot read environment variables either, so every
## deployment-specific value (hosts, credentials) is injected by docker-compose
## through EMQX's own EMQX_* override mechanism instead.
## ─────────────────────────────────────────────────────────────

node {
  name = "emqx@127.0.0.1"
  cookie = "pulse-emqx-cookie"
  data_dir = "/opt/emqx/data"
}

log {
  console {
    enable = true
    level = warning
  }
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 100000
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
  websocket.mqtt_path = "/mqtt"
  max_connections = 100000
}

listeners.ssl.default {
  enable = false
}

listeners.wss.default {
  enable = false
}

dashboard {
  listeners.http {
    bind = 18083
  }
  default_username = "admin"
}

## Anonymous connections are rejected: every client is either a device row or a
## service account. Server, database, username and password are supplied via
## EMQX_AUTHENTICATION__1__* in docker-compose.yml.
authentication = [
  {
    mechanism = password_based
    backend = postgresql
    enable = true
    pool_size = 8
    query = "SELECT password_hash, salt, is_superuser FROM emqx_authn WHERE username = ${username} LIMIT 1"
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
  }
]

authorization {
  no_match = deny
  deny_action = disconnect
  cache {
    enable = true
    max_size = 32
    ttl = 60s
  }
  sources = [
    {
      type = postgresql
      enable = true
      pool_size = 8
      query = "SELECT permission, action, topic FROM emqx_acl WHERE username = ${username}"
    }
  ]
}

## A device reconnecting in a tight loop under a flapping link must not be able to
## exhaust the broker.
force_shutdown {
  enable = true
  max_mailbox_size = 10000
}

mqtt {
  max_packet_size = 64KB
  max_topic_levels = 8
  retain_available = true
  keepalive_multiplier = 1.5
}
