# ─────────────────────────────────────────────────────────────
# Pulse IoT — nginx reverse proxy (alternative to infra/caddy/Caddyfile)
#
# Serves the built SPA and proxies the API from the SAME origin, which is what
# lets the httpOnly refresh cookie work with no CORS exceptions.
#
# Deploy with:
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d --build
#
# DIFFERENCES FROM THE CADDY SETUP — read before choosing this one:
#   * No automatic HTTPS. Caddy obtains and renews certificates by itself; here
#     you run certbot and mount the result (see the commented server block).
#   * The certsync sidecar becomes a no-op: it copies certificates out of
#     Caddy's data volume, and with nginx there are none. Feeding EMQX a
#     certificate for mqtts becomes manual — see docs/DEPLOY.md.
#   * zstd is not in stock nginx, so responses are gzip only.
# ─────────────────────────────────────────────────────────────

worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # Caddy's `-Server`: do not advertise the version to the internet.
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # THE MOST IMPORTANT FOUR LINES IN THIS FILE.
    #
    # Caddy upgrades WebSockets with no configuration; nginx does not. Without
    # this map plus the Upgrade/Connection headers in each location below, the
    # upgrade is silently downgraded to a plain request and the browser reports
    # "Invalid frame header" — the dashboard's live badge sticks on Offline and
    # the device uplink on /api/v1/ingest/ws fails identically, with nothing in
    # the panel to explain why.
    #
    # `map` is only valid in the http context, which is why this file replaces
    # nginx.conf wholesale rather than dropping into conf.d/.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS. Resolving per request with a short TTL, rather than
    # once at config load, matters twice over:
    #   * an `upstream` block resolves `api` while nginx parses the config, so
    #     `nginx -t` fails anywhere `api` does not exist — including at image
    #     build time;
    #   * it also pins the container IP for the process lifetime, so any
    #     `docker compose up -d api` hands the panel a stale address and every
    #     request 502s until nginx is restarted too.
    # A variable in proxy_pass is what defers resolution to request time.
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen      80;
        listen      [::]:80;
        server_name _;

        root  /srv;
        index index.html;

        # Fastify's own bodyLimit is 1 MB; leave headroom so oversized requests
        # are rejected by the app with a JSON error rather than by nginx.
        client_max_body_size 2m;

        # ── API, device ingest and realtime ─────────────────────────────────
        # /api/ carries both plain REST and the device WebSocket uplink at
        # /api/v1/ingest/ws, so the upgrade headers belong here too. They are
        # harmless for ordinary requests: with no Upgrade header the map yields
        # "close", which is the normal value.
        location /api/ {
            set                $api_upstream api:4000;
            # $request_uri is REQUIRED: once proxy_pass contains a variable,
            # nginx stops appending the original URI automatically.
            proxy_pass         http://$api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            # Deliberately $remote_addr, NOT $proxy_add_x_forwarded_for. The API
            # keys its rate limiter on req.ip; appending to a client-supplied
            # chain would let anyone mint a fresh bucket per request and walk
            # straight through the login brute-force limits.
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # Buffering off: it would defeat the COPY-streamed CSV export, which
            # is designed never to materialise a 30-day range in memory.
            proxy_buffering    off;
        }

        # ── Socket.IO (dashboard live values) ───────────────────────────────
        location /socket.io/ {
            set                $api_upstream api:4000;
            # $request_uri is REQUIRED: once proxy_pass contains a variable,
            # nginx stops appending the original URI automatically.
            proxy_pass         http://$api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering    off;
        }

        location = /health {
            set              $api_upstream api:4000;
            proxy_pass       http://$api_upstream$request_uri;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log       off;
        }

        # ── Static assets ───────────────────────────────────────────────────
        # Vite fingerprints these filenames, so they can be cached forever.
        location /assets/ {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options        DENY     always;
            add_header Referrer-Policy        strict-origin-when-cross-origin always;
            add_header Cache-Control          "public, max-age=31536000, immutable" always;
            try_files  $uri =404;
        }

        # ── SPA fallback ────────────────────────────────────────────────────
        # index.html must never be cached, or a deploy strands clients on a
        # stale bundle referencing assets that no longer exist.
        #
        # The security headers are repeated here because nginx does NOT inherit
        # add_header from an outer block once an inner block declares its own.
        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options        DENY     always;
            add_header Referrer-Policy        strict-origin-when-cross-origin always;
            add_header Cache-Control          "no-cache" always;
            try_files  $uri $uri/ /index.html;
        }
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    # nginx ships no ACME client. Obtain a certificate once with certbot:
    #
    #   docker run --rm -p 80:80 -v /etc/letsencrypt:/etc/letsencrypt \
    #     certbot/certbot certonly --standalone -d panel.example.com
    #
    # then mount /etc/letsencrypt into this container, uncomment the block
    # below, duplicate every location from the server above into it, and add a
    # renewal cron. Set COOKIE_SECURE=true and PUBLIC_URL=https://... in .env
    # and re-run `docker compose up -d` so the API picks them up.
    #
    # Caddy does the whole of this unattended, which is why it remains the
    # default. This path exists for deployments that standardise on nginx.
    #
    # server {
    #     listen 443 ssl;
    #     http2  on;
    #     server_name panel.example.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     ... every location block from the server above ...
    # }
}
