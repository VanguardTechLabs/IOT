; ─────────────────────────────────────────────────────────────
; Pulse IoT — PlatformIO build for the reference firmware.
;
;   pio run -t upload -t monitor
;
; `src_dir = .` compiles pulse_esp32.ino in place, so the Arduino IDE and
; PlatformIO share one source file rather than two copies that drift apart.
; ─────────────────────────────────────────────────────────────
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    ; PubSubClient's 256-byte default silently truncates a nine-variable payload.
    -DMQTT_MAX_PACKET_SIZE=768
    -DCORE_DEBUG_LEVEL=1

; Same firmware over mqtts://<host>:8883. Requires MQTT_TLS_ENABLED=true on the
; server; see docs/DEPLOY.md.
[env:esp32dev-tls]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DPULSE_USE_TLS=1
